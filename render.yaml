services:
  - type: web
    name: pesalens-api
    runtime: python
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: .venv/bin/gunicorn "app:create_app()" --timeout 120 --workers 1
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.9
